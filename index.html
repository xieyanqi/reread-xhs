<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾读 · 小红书收藏复读</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="masthead">
      <img src="icons/48.png" width="40" height="40" alt="">
      <div><h1>拾读</h1><p>小红书收藏复读</p></div>
      <button id="open-workspace" class="quiet workspace" type="button">独立窗口 ↗</button>
    </header>
    <section class="scan" aria-labelledby="scan-title">
      <h2 id="scan-title">收藏对账</h2>
      <div class="card-actions">
        <button id="scan-start" class="primary" type="button">从头扫描第一批</button>
        <button id="scan-next" class="primary" type="button" hidden>扫描下一批</button>
        <button id="scan-resume" type="button" hidden>继续扫描</button>
        <button id="scan-pause" type="button" hidden>暂停扫描</button>
        <button id="scan-export" type="button" hidden>导出对账 CSV</button>
      </div>
      <p id="scan-summary" class="notice" role="status"></p>
      <progress id="scan-progress" hidden></progress>
      <p id="site-block" class="notice" role="status" hidden></p>
      <button id="site-resume" type="button" hidden>收藏页恢复后重新检查</button>
      <p id="notice" class="notice" role="status"></p>
    </section>
    <section id="pending-panel" class="scan" aria-labelledby="pending-title" hidden>
      <h2 id="pending-title">待取消</h2>
      <p class="notice">连续快速取消收藏可能触发小红书访问限制。每点一次只处理当前一条，遇到限制会保留进度。</p>
      <p id="pending-count" class="notice" role="status"></p>
      <div id="pending-current" hidden>
        <p id="pending-name" class="pending-name"></p>
        <div class="card-actions">
          <button id="pending-apply" class="primary" type="button">取消收藏并移出</button>
          <button id="pending-drop" type="button">移出待取消名单</button>
        </div>
      </div>
    </section>
    <nav aria-label="收藏列表">
      <button type="button" data-view="inbox">待复读 <span></span></button>
      <button type="button" data-view="due">待回看 <span></span></button>
      <button type="button" data-view="all">本批全部 <span></span></button>
    </nav>
    <div class="card-actions"><button id="open-cleanup" type="button">整理收藏 ↗</button></div>
    <input id="item-search" type="search" aria-label="搜索收藏" placeholder="搜索标题、笔记或帖子 ID">
    <div class="card-actions" id="pager" hidden>
      <button id="previous-page" type="button">上一页</button>
      <span id="page-position" aria-live="polite"></span>
      <button id="next-page" type="button">下一页</button>
    </div>
    <section id="list" aria-label="收藏条目"></section>
    <footer><button id="export" class="quiet" type="button">导出 Markdown</button><span>保存在当前浏览器</span></footer>
  </main>
  <template id="card-template">
    <article class="card">
      <div class="meta"><span class="kind"></span><span class="date"></span></div>
      <h2></h2>
      <p class="body"></p>
      <div class="card-actions">
        <a target="_blank" rel="noopener noreferrer">打开原帖 ↗</a>
        <button class="edit" type="button"></button>
        <button class="check" type="button">记录复盘</button>
        <button class="uncollect" type="button">取消收藏并移出</button>
      </div>
      <details class="history"><summary></summary><ol></ol></details>
    </article>
  </template>
  <dialog id="editor">
    <form id="edit-form">
      <h2>复读后怎么用？</h2>
      <label for="title">标题</label>
      <input id="title" maxlength="120" placeholder="给这条收藏起个名字">
      <label for="kind">处理方式</label>
      <select id="kind">
        <option value="note">写成笔记</option>
        <option value="action">转成行动</option>
        <option value="archived">归档</option>
      </select>
      <label id="body-label" for="body">用自己的话写下值得留下的内容</label>
      <textarea id="body" rows="4" maxlength="10000"></textarea>
      <div id="date-field"><label for="due-date">回看日期</label><input id="due-date" type="date"></div>
      <p class="error" role="status"></p>
      <div class="dialog-actions"><button class="cancel" type="button">取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <dialog id="check-dialog">
    <form id="check-form">
      <h2>记录复盘</h2>
      <label for="outcome">这次怎么样？</label>
      <select id="outcome">
        <option value="progress">有进展</option>
        <option value="blocked">卡住了</option>
        <option value="complete">已完成，结束跟进</option>
      </select>
      <label id="check-label" for="check-text">这次做了什么？</label>
      <textarea id="check-text" rows="4" required maxlength="10000"></textarea>
      <div id="next-field"><label for="next-date">下次回看日期</label><input id="next-date" type="date" required></div>
      <p class="error" role="status"></p>
      <div class="dialog-actions"><button class="cancel" type="button">取消</button><button class="primary" type="submit">保存复盘</button></div>
    </form>
  </dialog>
  <script src="app.js" type="module"></script>
</body>
</html>
